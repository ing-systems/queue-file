[package]
name = "queue-file"
version = "2.0.0"
license = "Apache-2.0"
authors = ["ING Systems <contact@ing-systems.com>"]
description = "queue-file is a lightning-fast, transactional, file-based FIFO"
edition = "2021"
homepage = "https://github.com/ing-systems/queue-file"
repository = "https://github.com/ing-systems/queue-file"
readme = "README.md"
keywords = ["io", "fifo", "queue"]
categories = ["data-structures"]
rust-version = "1.58.1"

[dependencies]
bytes = "1.0"
crc32fast = "1"
thiserror = "1.0"

[dev-dependencies]
auto-delete-path = "0.2.0"
criterion = "0.3"
once_cell = "1.8"
quickcheck = "1.0.3"
quickcheck_macros = "1.0.0"
test-case = "2.1.0"
